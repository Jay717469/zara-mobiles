version: '3.8'

services:
  # 1. MySQL 8 Database
  db:
    image: mysql:8.0
    container_name: zara-mobiles-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zara_mobiles_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
      - ./database/seed-reference-products.sql:/docker-entrypoint-initdb.d/03-reference-products.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zara-network

  # 2. Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zara-mobiles-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: zara_mobiles_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      JWT_SECRET: zaraMobilesSuperSecretKey2026SecureJwtTokenGeneratorAuthenticationKeyWithHighEntropy512BitsLong!
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      RAZORPAY_KEY_ID: rzp_test_zaramobiles2026
      RAZORPAY_KEY_SECRET: rzp_test_secret_zaramobiles_key_2026
    ports:
      - "8080:8080"
    networks:
      - zara-network

  # 3. React Frontend + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: zara-mobiles-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - zara-network

volumes:
  mysql_data:
    driver: local

networks:
  zara-network:
    driver: bridge
