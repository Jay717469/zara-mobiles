# ========================================================
# ZARA MOBILES - Spring Boot Configuration
# ========================================================

server.port=8080
server.servlet.context-path=/api

spring.application.name=zara-mobiles-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zara_mobiles_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:zaraMobilesSuperSecretKey2026SecureJwtTokenGeneratorAuthenticationKeyWithHighEntropy512BitsLong!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay Configuration (Test Mode)
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_zaramobiles2026}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:rzp_test_secret_zaramobiles_key_2026}
app.razorpay.currency=INR

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Springdoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
